<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Contact Form</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:#f2f4f7}.form-box{width:92%;max-width:420px;background:#fff;padding:25px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.12)}h2{text-align:center;margin-top:0}input,textarea,button{width:100%;padding:13px;margin-top:12px;border-radius:8px;font-size:16px}input,textarea{border:1px solid #ccc}textarea{min-height:120px;resize:vertical}button{border:0;background:#111827;color:#fff;cursor:pointer}</style>
</head><body><div class="form-box"><h2>Contact Us</h2>
<form action="https://formsubmit.co/YOUR_EMAIL@gmail.com" method="POST">
<input type="text" name="name" placeholder="Your Name" required>
<input type="tel" name="phone" placeholder="Your Phone Number" required>
<textarea name="message" placeholder="Your Message" required></textarea>
<input type="hidden" name="_subject" value="New Website Enquiry"><input type="hidden" name="_captcha" value="false">
<button type="submit">Submit</button></form></div></body></html>
